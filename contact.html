    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="profile-section">
                <div class="profile-pic">
                    <img src="assets/profile.jpg" alt="Eli Daniel" class="profile-pic">
                </div>

            <nav>

                <ul class="nav-links">

    <div id="profileModal" class="modal">
        <span class="close-modal">&times;</span>
        <img src="assets/profile.jpg" alt="Eli Daniel" class="modal-content" id="modalImg">
    </div>

    <main>
        <section id="contact">
            <h2>Me Contacter</h2>
            <div class="contact-container">
                <div class="contact-card contact-form-card">
                    <h3 class="cf-title"><i class="fas fa-paper-plane"></i> Envoyez-moi un message</h3>
                    <form id="contactForm" action="https://formspree.io/f/mdaqralo" method="POST" novalidate>
                        <label class="cf-field">Nom
                            <input type="text" id="cf-nom" required placeholder="Votre nom">
                        </label>
                        <label class="cf-field">Email
                            <input type="email" id="cf-email" required placeholder="votre@email.com">
                        </label>
                        <label class="cf-field">Message
                            <textarea id="cf-message" rows="5" required placeholder="Votre message…"></textarea>
                        </label>
                        <button type="submit"><i class="fas fa-paper-plane"></i> Envoyer</button>
                        <p class="cf-note" id="cf-note"></p>
                    </form>
                </div>
                <div class="contact-card">
                    <div class="contact-info">
                        <a href="mailto:elidanieldaniel2@gmail.com" class="contact-item email">
                            <i class="fas fa-envelope"></i>
                            <span>elidanieldaniel2@gmail.com</span>
                        </a>
                        
                        <a href="http://linkedin.com/in/eli-senyo-79651929a" class="contact-item linkedin">
                            <i class="fab fa-linkedin"></i>
                            <span>Eli Senyo</span>
                        </a>
                        
                        <a href="https://github.com/eliDaniel007" class="contact-item github">
                            <i class="fab fa-github"></i>
                            <span>eliDaniel007</span>
                        </a>
                    </div>
                    
                    <div class="contact-message">
                        <p>Je suis toujours ouvert aux nouvelles opportunités et aux échanges enrichissants.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Eli Daniel - Tous droits réservés</p>
    </footer>

    <script src="script.js"></script>
    <script>
        // Formulaire de contact : envoi in-page via Formspree.
        (function () {
            const form = document.getElementById('contactForm');
            if (!form) return;
            const note = document.getElementById('cf-note');
            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                const nom = document.getElementById('cf-nom').value.trim();
                const email = document.getElementById('cf-email').value.trim();
                const msg = document.getElementById('cf-message').value.trim();
                if (!nom || !email || !msg) {
                    note.textContent = '⚠️ Merci de remplir tous les champs.';
                    note.className = 'cf-note ko';
                    return;
                }
                const btn = form.querySelector('button');
                btn.disabled = true;
                note.textContent = 'Envoi…';
                note.className = 'cf-note';
                try {
                    const r = await fetch(form.action, {
                        method: 'POST',
                        headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' },
                        body: JSON.stringify({ name: nom, email: email, message: msg })
                    });
                    if (r.ok) {
                        note.textContent = '✅ Message envoyé, merci ! Je vous répondrai rapidement.';
                        note.className = 'cf-note ok';
                        form.reset();
                    } else {
                        const d = await r.json().catch(() => ({}));
                        const detail = d.errors ? d.errors.map(x => x.message).join(', ') : 'Erreur lors de l\'envoi.';
                        note.textContent = '⚠️ ' + detail;
                        note.className = 'cf-note ko';
                    }
                } catch (err) {
                    note.textContent = '⚠️ Impossible d\'envoyer le message. Réessaie ou écris-moi directement par email.';
                    note.className = 'cf-note ko';
                } finally {
                    btn.disabled = false;
                }
            });
        })();
    </script>
</body>
